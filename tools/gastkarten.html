<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gast-Karten</title>
<style>
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("../hub/assets/fonts/atkinson-hyperlegible-400.woff2") format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../hub/assets/fonts/atkinson-hyperlegible-700.woff2") format("woff2"); }
  @font-face { font-family: "Caveat Brush"; src: url("../hub/assets/fonts/caveat-brush-400.woff2") format("woff2"); }
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Atkinson Hyperlegible", Arial, sans-serif; color: #1B2A55; background: #F2EADA; }
  .bar { max-width: 190mm; margin: 12px auto; padding: 10px 14px; background: #fff; border-radius: 10px; font-size: 14px; }
  .bar button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: #1B2A55; color: #fff; cursor: pointer; }
  .sheet { max-width: 190mm; margin: 0 auto; background: #fff; padding: 6mm; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .card { border: 2px dashed #8C7A5E; border-radius: 14px; padding: 5mm; display: grid; grid-template-columns: 26mm 1fr; gap: 3mm 5mm; align-items: center; break-inside: avoid; min-height: 62mm; }
  .card h2 { grid-column: 1 / -1; margin: 0; font: 400 20pt/1 "Caveat Brush", cursive; }
  .card h2 small { display: block; font: 400 9.5pt/1.3 "Atkinson Hyperlegible", Arial, sans-serif; color: #3D4560; margin-top: 2px; }
  .card img.av { width: 26mm; height: 26mm; border-radius: 50%; }
  .code { font: 700 15pt/1.1 ui-monospace, Consolas, monospace; letter-spacing: 1px; border: 2px solid #1B2A55; border-radius: 8px; padding: 3px 8px; display: inline-block; }
  .qr { width: 26mm; height: 26mm; }
  .qr svg { width: 100%; height: 100%; }
  .hint { font-size: 9.5pt; color: #3D4560; line-height: 1.35; }
  .howto { grid-column: 1 / -1; border: 2px solid #1B2A55; border-radius: 14px; padding: 5mm 7mm; font-size: 11pt; line-height: 1.45; break-inside: avoid; }
  .howto h3 { margin: 0 0 4px; font: 400 18pt/1.1 "Caveat Brush", cursive; }
  .howto ol { margin: 4px 0 0; padding-left: 6mm; }
  .howto li { margin: 0 0 3px; }
  @media print { body { background: #fff; } .bar { display: none; } .sheet { padding: 0; } }
</style>
</head>
<body>
<div class="bar">Gast-Karten für den Unterrichtsbesuch. Die Codes sind fest (GAST-KO01 … KO06) und erscheinen <b>nicht</b> in der Klassenauswertung.
  Eine Karte pro Gast, die Anleitung einmal pro Gast oder als Tischkarte. <button type="button" onclick="print()">Drucken</button></div>
<div class="sheet" id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  var CODES = ['GAST-KO01', 'GAST-KO02', 'GAST-KO03', 'GAST-KO04', 'GAST-KO05', 'GAST-KO06'];
  var HUB = 'https://vogelfrei7.github.io/Hub_Australia_Unit1/hub/?st=SPPP&code=';   // öffnet die Karte an der Station Darwin
  function qr(text) { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); }
  var cards = CODES.map(function (c) {
    return '<div class="card"><h2>Welcome on board!<small>Sie reisen heute mit der 09c durch Australien. (Guest traveller)</small></h2>' +
      '<img class="av" src="../hub/assets/img/animals/koala.webp" alt="Koala">' +
      '<div><div class="code">' + c + '</div><p class="hint" style="margin:6px 0 0">QR-Code scannen – die Karte öffnet sich mit Ihrem Code an der Station <b>Darwin</b>.</p></div>' +
      '<div class="qr">' + qr(HUB + c) + '</div>' +
      '<p class="hint" style="margin:0">Ihr Lotse (ein Kind der Klasse) zeigt Ihnen den Weg. Ihre Ergebnisse fließen nicht in die Auswertung der Klasse ein.</p></div>';
  }).join('');
  var howto = '<div class="howto"><h3>So probieren Sie es aus – in 5 Minuten</h3><ol>' +
    '<li><b>QR-Code scannen.</b> Die Karte zeigt Ihre Reise: Die ersten Stationen sind schon geschafft, Ihr Campervan steht in <b>Darwin</b>.</li>' +
    '<li>Auf <b>Darwin</b> tippen → <b>Copy start code</b> → unten ins Coach-Feld tippen, einfügen, senden. Es öffnet sich der Chat mit dem Coach.</li>' +
    '<li><b>Practice (Üben)</b> wählen. Der Coach stellt 8 Sätze: simple past oder present perfect? Antworten Sie z. B. <i>1 saw, 2 have been …</i></li>' +
    '<li>Sie bekommen eine Rückmeldung wie die Kinder – mit Erklärung, Stärke und Tipp. Am Ende: <b>„🏅 Get your stamp“</b> antippen.</li>' +
    '<li>Zurück auf der Karte: Ihr Stern und Ihr Stempel sind da – und die Station Darwin erwacht. Im <b>Pass</b> sehen Sie Ihre Reise.</li>' +
    '</ol><p class="hint" style="margin:6px 0 0">Datenschutz: Die Kinder arbeiten nur mit solchen Tier-Codes – nie mit Namen. Die Zuordnung Code → Kind kennt nur die Lehrkraft (auf Papier).</p></div>';
  document.getElementById('sheet').innerHTML = cards + howto;
</script>
</body>
</html>
